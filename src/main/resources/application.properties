#===================================================================#
# Propiedades de tomcat                                             #
#===================================================================#
spring.application.name=midellware_ApiMaze
server.port=8082
api.tvmaze.name=apiTvMaze
api.tvmaze.url=https://api.tvmaze.com
#===================================================================#
# Propiedades generales de configuracion                            #
#===================================================================#
application.api.uri.title=MidelWareMazei
application.api.uri.version=1.0
application.api.uri.description=Conector para realizar la conexion con el api de maze
application.api.server.url=http://localhost:${server.port}
#===================================================================#
# Propiedades de lOG(JPA,general y local)                                           #
#===================================================================#
logging.level.com.biometriaaplicada.migration=info
logging.pattern.console="%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{5}){cyan} %clr(:){faint} %40(%clr([%M])) %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
logging.pattern.file="%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} : [%M] : %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
#logging.file.name=/var/log/migracion/log.log


